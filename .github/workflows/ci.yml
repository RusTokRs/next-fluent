name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.profile.node }} / Next ${{ matrix.profile.next }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile:
          - {node: 22.x, next: '15'}
          - {node: 22.x, next: '16'}
          - {node: 24.x, next: '15'}
          - {node: 24.x, next: '16'}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.profile.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.profile.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Next.js 16 for integration matrix
        if: matrix.profile.next == '16'
        run: npm install --no-save --package-lock=false next@^16

      - name: Run build
        run: npm run build

      - name: Verify build artifacts are in sync with source
        run: npm run check-dist

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Verify generated consumer types
        run: npm run test:types

      # Builds a throwaway consumer and checks the published contract: exports
      # resolution, declared dependencies, CommonJS and ESM `next.config`, and
      # the shipped `.d.ts` / `.d.cts` under `module: nodenext`.
      - name: Verify consumer contract
        run: npm run test:consumer

      - name: Run test suite
        run: npm test

      - name: Verify edge runtime compatibility
        run: npm run test:edge

      - name: Verify client bundle size budgets
        run: npm run size

      - name: Install Chromium for browser integration
        if: matrix.os == 'ubuntu-latest' && matrix.profile.node == '22.x' && matrix.profile.next == '16'
        run: npx --yes --package @playwright/cli@0.1.21 playwright-cli install-browser chromium

      - name: Report the Next.js version under test
        run: node -p "'[ci] next ' + require('next/package.json').version"

      - name: Build a real Next.js consumer app
        env:
          NEXT_FLUENT_BROWSER: ${{ matrix.os == 'ubuntu-latest' && matrix.profile.node == '22.x' && matrix.profile.next == '16' && '1' || '0' }}
        # On failure the tail is re-emitted as an error annotation, so the reason
        # is readable from the check run itself instead of requiring the raw log
        # archive (which is awkward to reach from restricted networks).
        shell: bash
        run: |
          set -o pipefail
          npm run test:next 2>&1 | tee /tmp/next-integration.log || {
            MSG=$(tail -n 40 /tmp/next-integration.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=next-fluent integration failed::${MSG}"
            exit 1
          }

      - name: Install Chromium for multi-domain regression
        if: matrix.os == 'ubuntu-latest' && matrix.profile.node == '22.x'
        run: npx playwright install --with-deps chromium

      - name: Verify multi-domain browser routing
        if: matrix.os == 'ubuntu-latest' && matrix.profile.node == '22.x'
        run: npm run test:next:domains
